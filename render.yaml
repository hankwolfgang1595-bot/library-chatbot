# render.yaml — Конфигурация деплоя на Render.com
#
# Render.com автоматически обнаружит этот файл и настроит сервис.
# Бесплатный план: сервис "засыпает" после 15 минут без запросов,
# первый запрос после "сна" может занять ~30-50 секунд.

services:
  - type: web
    name: library-chatbot
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
